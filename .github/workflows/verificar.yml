name: Verificar conexión con Instagram

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/verificar.yml", "scripts/verificar.mjs"]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Probar token
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
        run: node scripts/verificar.mjs
