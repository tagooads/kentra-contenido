name: Publicar en Instagram y Facebook

on:
  schedule:
    - cron: "7 * * * *" # cada hora, al minuto 7
    - cron: "*/15 * * * *" # respaldo: GitHub se salta ejecuciones
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["calendario.json", "piezas/**", "scripts/publicar.mjs", ".github/workflows/publicar.yml"]

permissions:
  contents: write

concurrency:
  group: publicar-instagram
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Publicar piezas pendientes
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
        run: node scripts/publicar.mjs
      - name: Actualizar vista de próximas publicaciones
        if: always()
        run: node scripts/proximas.mjs
      - name: Guardar estado del calendario
        if: always()
        run: |
          if [ -n "$(git status --porcelain calendario.json PROXIMAS.md)" ]; then
            git config user.name "kentra-bot"
            git config user.email "kentra-bot@users.noreply.github.com"
            git add calendario.json PROXIMAS.md
            git commit -m "Estado de publicación $(date -u +%FT%RZ) [skip ci]"
            git pull --rebase origin main
            git push
          fi
